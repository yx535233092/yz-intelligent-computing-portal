name: h3c_portal CI/CD PipeLine

# 当代码推送至master分支，触发工作流
on:
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1.检出代码
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2.设置nodejs环境
      - name: Setup Nodejs
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      # 3.安装依赖
      - name: Install Dependencies
        run: npm config set registry https://registry.npmmirror.com && npm install --legacy-peer-deps

      # 4.构建Nextjs 项目
      - name: Build Nextjs Project
        run: npm run build

      # 5.构建产物打包
      - name: Tar Build
        run: tar -czvf build.tar.gz .next/ public/ package.json next.config.ts ecosystem.config.js prisma/ src/generated/

      # 6.检查上传路径是否存在
      - name: Check Upload Path
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.TULING_TOWN_PRIVATE }}
          port: ${{ secrets.PORT }}
          script: |
            if [ ! -d "/private/yz-portal/frontend" ]; then
              echo "目录不存在，正在创建..."
              mkdir -p /private/yz-portal/frontend
            else
              echo "目录已存在。"
            fi

      # 7.上传构建产物
      - name: Copy to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.TULING_TOWN_PRIVATE }}
          port: ${{ secrets.PORT }}
          source: build.tar.gz
          target: /private/yz-portal/frontend/
          clean: true

      # 8.部署到服务器,解压打包文件，重启pm2服务
      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.TULING_TOWN_PRIVATE }}
          port: ${{ secrets.PORT }}
          script: |
            # 进入目录
            cd /private/yz-portal/frontend
            # 解压打包文件
            tar -xzvf build.tar.gz
            # 删除打包文件
            rm -rf build.tar.gz
            # 安装依赖
            echo "正在安装生产环境依赖..."
            npm install --production
            # 生成 Prisma Client
            echo "正在生成 Prisma Client..."
            npx prisma generate
            # 检查pm2进程
            if pm2 describe "yz-portal" > /dev/null 2>&1; then
              echo "yz-portal 已启动，正在重载"
              pm2 reload yz-portal
            else
              echo "yz-portal 未启动，正在启动"
              pm2 start ecosystem.config.js
              pm2 save
            fi
