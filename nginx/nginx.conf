worker_processes 1;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 500M;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream nextjs_app {
        server web:3000;
    }

    upstream python_api {
        server python-api:9000;
    }

    server {
        listen 80;
        server_name localhost;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        location / {
            proxy_pass http://nextjs_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /py-api/ {
            proxy_pass http://python_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_hide_header Access-Control-Allow-Origin;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        location /hj/ {
            proxy_pass https://lab.iwhalecloud.com/;
            proxy_ssl_server_name on;
            proxy_set_header Host lab.iwhalecloud.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_redirect https://lab.iwhalecloud.com/ /hj/;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        location /chat {
            proxy_pass https://lab.iwhalecloud.com/chat;
            proxy_ssl_server_name on;
            proxy_set_header Host lab.iwhalecloud.com;
            proxy_set_header X-Real-IP $remote_addr;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        location /docchain {
            proxy_pass https://lab.iwhalecloud.com/docchain;
            proxy_ssl_server_name on;
            proxy_set_header Host lab.iwhalecloud.com;
            proxy_set_header X-Real-IP $remote_addr;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }
    }
}
