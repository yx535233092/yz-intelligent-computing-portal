
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    server {
        listen       8080;
        server_name  localhost;

        location / {
            root   html;
            index  index.html index.htm;
        }


        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

       deny  all;
    }

    server {
        listen 9000;  # 监听 9000 端口，并启用 SSL
        server_name localhost;

        # SSL 证书和私钥文件路径，替换为你在上一步生成的实际路径
        # ssl_certificate /opt/homebrew/etc/nginx/localhost.crt;
        # ssl_certificate_key /opt/homebrew/etc/nginx/localhost.key;

        # 代理配置
        location / {
           # 将请求代理到 HTTP 地址
        proxy_pass http://h3c-portal:3000;

        # 重写请求头，确保目标服务器能正确处理请求
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        }

	
        # 统一处理所有代理请求
        location /platform { 
        # proxy_pass 后面的地址不能有斜杠，否则 Nginx 会处理路径重写
            proxy_pass https://lab.iwhalecloud.com/; 

            proxy_set_header Host lab.iwhalecloud.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # 核心设置：重写响应体中的URL
            # 将 lab.iwhalecloud.com 的所有 URL 重写为 localhost:9000/test
            sub_filter 'lab.iwhalecloud.com' 'localhost:9000/test';
            sub_filter_once off;

        }
        location /chat {
            # proxy_pass 指令将请求转发到目标地址
            proxy_pass https://lab.iwhalecloud.com/chat;

            # 重写请求头，这是非常关键的步骤
            # 告诉目标服务器请求的Host是lab.iwhalecloud.com
            proxy_set_header Host lab.iwhalecloud.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 确保代理能够处理HTTPS
            proxy_ssl_server_name on;
            proxy_ssl_session_reuse on;
        }
        location /docchain {
            # proxy_pass 指令将请求转发到目标地址
            proxy_pass https://lab.iwhalecloud.com/docchain;

            # 重写请求头，这是非常关键的步骤
            # 告诉目标服务器请求的Host是lab.iwhalecloud.com
            proxy_set_header Host lab.iwhalecloud.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 确保代理能够处理HTTPS
            proxy_ssl_server_name on;
            proxy_ssl_session_reuse on;
        }
    }


  
    include servers/*;
}
