services:
  dev:
    container_name: yz-portal-h3c-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: deps # 使用 Dockerfile 的依赖安装阶段作为基础
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:/app/prisma/sqlite.db
      # 开启文件轮询，解决部分环境下（如 Docker Desktop for Windows/Mac）热更新不生效的问题
      # 如果热更新正常，可以注释掉此行以降低 CPU 占用
      - WATCHPACK_POLLING=true
    env_file:
      - .env
    volumes:
      # 挂载当前目录代码到容器，实现代码修改实时同步
      - .:/app

      # 隔离容器内的 node_modules，避免与宿主机混淆（特别是二进制依赖）
      # Docker 会在容器启动时将镜像中的 node_modules 复制到这个卷中
      - /app/node_modules

      # 隔离 .next 构建目录，避免与本地构建冲突
      - /app/.next

    # 启动命令：先重新生成 Prisma Client（适配 Linux 环境），然后启动开发服务器
    command: sh -c "npx prisma generate && npm run dev"

  nginx:
    image: nginx:stable-alpine
    container_name: yz-portal-nginx-dev
    restart: always
    ports:
      - "12800:80" # 项目本地入口 (Host: 8001 -> Container: 80)
      - "12810:8080" # 浩鲸平台代理 (Host: 10088 -> Container: 10088)
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf
    depends_on:
      - dev
